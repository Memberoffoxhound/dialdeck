services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dialdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dialdeck}
      POSTGRES_DB: ${POSTGRES_DB:-dialdeck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dialdeck}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dialdeck}"]
    volumes:
      - redis:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dialdeck}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dialdeck}
    volumes:
      - minio:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro,z
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      DATA_DIR: /data
      INVITE_CODE: ${INVITE_CODE:-family}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecre}
      LIVEKIT_HOST: http://127.0.0.1:7880
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      REACHABILITY_MODE: ${REACHABILITY_MODE:-public}
      VIDEO_MIN: ${VIDEO_MIN:-480p}
      VIDEO_MAX: ${VIDEO_MAX:-1080p}
      VIDEO_FPS: ${VIDEO_FPS:-60}
      VIDEO_MODE: ${VIDEO_MODE:-vbr-auto}
    volumes:
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    command: ["sh", "/opt/caddy-start.sh"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./deploy/tls:/certs:z
      - ./scripts/caddy-start.sh:/opt/caddy-start.sh:ro,z
    ports:
      - "${HTTP_PORT:-8090}:8080"
      - "8443:8443"
    extra_hosts:
      - "livekit:host-gateway"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redis:
  minio:
  api-data:
